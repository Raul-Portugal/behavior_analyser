name: tests

on:
  push:
    branches: [main, "release/**", "fix/**", "chore/**", "codex/**"]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v -i '^pyinstaller' requirements-lock.txt > ci-requirements.txt
          python -m pip install -r ci-requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
